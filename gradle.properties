# Projekt szintű Gradle beállítások.
# IDE (pl. Android Studio) felhasználóknak:
# az IDE-ben megadott Gradle beállítások *felülírják*
# az ebben a fájlban megadott beállításokat.
# A build környezet beállításáról további részletek:
# http://www.gradle.org/docs/current/userguide/build_environment.html
# A daemon folyamat JVM argumentumai.
# Ez főleg a memória beállítások finomhangolásához hasznos.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Ha be van állítva, a Gradle kísérleti párhuzamos módban fut.
# Csak egymástól független projekteknél használd. További részletek:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Bekapcsolva a Configuration Cache lehetővé teszi, hogy a Gradle teljesen kihagyja a konfigurációs
# fázist, ha semmi sem változott, ami a build konfigurációját befolyásolja (például a build szkriptek).
# Emellett a Gradle teljesítményoptimalizálásokat alkalmaz a feladatok futtatásakor.
org.gradle.configuration-cache=true